# Kök `docker-compose.yml` — PRODUCTION dağıtımı (web + api + db + guacd).
#
# `infra/docker-compose.yml` (yalnızca db + guacd) ile KARIŞTIRMAYIN —
# o dosya, backend/frontend'in bu makinede NATIVE process olarak
# (`uvicorn`/`next dev`) çalıştırıldığı GELİŞTİRME iş akışı için hâlâ
# geçerlidir ve DEĞİŞTİRİLMEDİ. Bu dosya, "yeni bir sunucuya sıfırdan"
# bağımsız kurulum için TÜM sistemi konteynerleştirir.
#
# Redis KASITLI olarak EKLENMEDİ: oturumlar stateless JWT'dir (Faz 46,
# sunucu tarafında hiçbir oturum durumu tutulmaz), e-posta bildirimi
# zaten kuyruksuz "ateşle-unut" bir asyncio task'ıdır (Faz 65/66) — hiçbir
# koda bağlı olmayan boş bir Redis container'ı eklemek CLAUDE.md'nin
# "gereksiz bağımlılık/kaynak ekleme" kuralını ihlal ederdi (kullanıcıyla
# netleştirildi). Alembic de KULLANILMADI — proje hiçbir zaman ORM/
# migration aracı kullanmadı; şema TEK bir dosyadan (`infra/postgres/
# init.sql`) gelir ve `api` servisi başlarken KENDİSİ uygular (bkz.
# `apps/api/app/main.py::_ensure_schema_once`) — ayrı bir "migrate"
# adımı GEREKMEZ.

services:
  db:
    image: postgres:16-alpine
    container_name: itops-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-itops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env dosyasında zorunlu}
      POSTGRES_DB: ${POSTGRES_DB:-itops}
    volumes:
      - itops_pgdata:/var/lib/postgresql/data
      # `init.sql` aynı zamanda `api`'nin kendisi tarafından da (tek
      # doğruluk kaynağı) uygulanır — burada mount edilmesi yalnızca
      # PostgreSQL'in ilk ayağa kalkışında şemayı hazır bulundurmak
      # için EK bir kolaylıktır, tekrar/çakışma riski yok (idempotent).
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-itops} -d ${POSTGRES_DB:-itops}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [itops]

  guacd:
    image: guacamole/guacd:1.5.5
    container_name: itops-guacd
    restart: unless-stopped
    volumes:
      - ./data/pam-recordings:/var/log/pam/recordings
      - ./data/pam-drives:/var/pam/drives
    networks: [itops]
    # Yalnızca `api` servisi tarafından, konteyner ağı üzerinden
    # (`guacd:4822`) konuşulur — production'da host'a AÇILMAZ (en az
    # yüzey ilkesi). `deploy.sh`/`deploy.ps1`'in açtığı 4822 firewall
    # kuralı, guacd'nin Docker DIŞINDA/ayrı bir host'ta çalıştırılması
    # gibi alternatif kurulumlar için bir seçenek olarak bırakıldı.

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: itops-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      guacd:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-itops}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-itops}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY .env dosyasında zorunlu}
      JWT_TOKEN_TTL_MINUTES: ${JWT_TOKEN_TTL_MINUTES:-480}
      PAM_VAULT_SECRET_KEY: ${PAM_VAULT_SECRET_KEY:?PAM_VAULT_SECRET_KEY .env dosyasında zorunlu}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      GUACD_HOST: guacd
      GUACD_PORT: "4822"
      GUACD_HOST_LOOPBACK_TARGET: host.docker.internal
      GUACD_RECORDING_PATH: /var/log/pam/recordings
      PAM_RECORDING_HOST_DIR: /data/pam-recordings
      GUACD_DRIVE_PATH: /var/pam/drives
      SMTP_SERVER: ${SMTP_SERVER:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-IT Operations Helpdesk}
      SMTP_IT_GROUP_EMAIL: ${SMTP_IT_GROUP_EMAIL:-}
      TICKET_BASE_URL: ${TICKET_BASE_URL:-}
      LDAP_AUTH_ENABLED: ${LDAP_AUTH_ENABLED:-false}
      LDAP_AUTH_DEFAULT_ROLE: ${LDAP_AUTH_DEFAULT_ROLE:-VIEWER}
      LDAP_SCHEDULED_SYNC_ENABLED: ${LDAP_SCHEDULED_SYNC_ENABLED:-true}
      SNMP_BACKGROUND_POLLING_ENABLED: ${SNMP_BACKGROUND_POLLING_ENABLED:-true}
      DISCOVERY_SCHEDULER_ENABLED: ${DISCOVERY_SCHEDULER_ENABLED:-true}
    volumes:
      - ./data/pam-recordings:/data/pam-recordings
    ports:
      - "8000:8000"
    networks: [itops]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: itops-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # `allowedDevOrigins` (NEXT_ALLOWED_DEV_ORIGINS) yalnızca `next dev`
      # içindir — production'da (`next start`/standalone) hiçbir etkisi
      # yok, bu yüzden burada set EDİLMEDİ.
      BACKEND_INTERNAL_URL: http://api:8000
    ports:
      - "${WEB_HTTP_PORT:-80}:3000"
    networks: [itops]

networks:
  itops:
    driver: bridge

volumes:
  itops_pgdata:
